@media (prefers-reduced-motion:reduce){.tka{animation:none}}
:root{--bg:#f3f7f4;--cd:#fff;--fg:#17211b;--mu:#6b7a70;--g2:#1b7a3a;--tn:#e3f3e8;--bd:#e1e8e3;--rd:#e53935;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;padding-bottom:130px}
html{overflow-x:hidden}
#a{max-width:520px;margin:auto;overflow-x:clip}
.hd{background:linear-gradient(135deg,#0f5a2f,#14733a);color:#fff;padding:14px 16px}
.top{display:flex;align-items:center;gap:10px}.top h2{margin:0;flex:1;font-size:17px}
.ib{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
.pad{padding:10px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px}
